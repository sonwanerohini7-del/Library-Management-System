<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f1f1;
            padding:50px;
        }

        .container{
            width:400px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            font-size:18px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Add Book</h1>

    <form action="/saveBook" method="post">

        <input type="text"
               name="title"
               placeholder="Book Title"
               required>

        <input type="text"
               name="author"
               placeholder="Author Name"
               required>

        <input type="text"
               name="category"
               placeholder="Category"
               required>

        <button type="submit">
            Save Book
        </button>

    </form>

</div>

</body>
</html>
