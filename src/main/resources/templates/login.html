<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Library Login</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#667eea,#764ba2);
            overflow:hidden;
        }

        .background-circle{
            position:absolute;
            border-radius:50%;
            filter: blur(80px);
            opacity:0.5;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#ff6ec4;
            top:-100px;
            left:-100px;
        }

        .circle2{
            width:350px;
            height:350px;
            background:#7873f5;
            bottom:-120px;
            right:-120px;
        }

        .login-container{
            position:relative;
            width:400px;
            padding:40px;
            border-radius:25px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            color:white;
            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-title{
            text-align:center;
            margin-bottom:30px;
            font-weight:600;
            font-size:32px;
        }

        .login-title span{
            color:#ffd369;
        }

        .form-control{
            height:50px;
            border:none;
            border-radius:12px;
            margin-bottom:20px;
            padding-left:15px;
            background:rgba(255,255,255,0.2);
            color:white;
        }

        .form-control::placeholder{
            color:#f1f1f1;
        }

        .form-control:focus{
            box-shadow:none;
            background:rgba(255,255,255,0.25);
            color:white;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:linear-gradient(to right,#ff512f,#dd2476);
            color:white;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:scale(1.03);
            box-shadow:0 5px 20px rgba(255,81,47,0.4);
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .bottom-text a{
            color:#ffd369;
            text-decoration:none;
            font-weight:500;
        }

        .icon{
            font-size:60px;
            text-align:center;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="login-container">

    <div class="icon">
        📚
    </div>

    <h2 class="login-title">
        Library <span>Login</span>
    </h2>

    <form method="post" action="/login">

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Enter Password"
               required>

        <button type="submit" class="btn-login">
            Login
        </button>

    </form>

    <div class="bottom-text">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>
</html>
