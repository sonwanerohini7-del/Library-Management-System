<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            height: 100vh;
        }

        .edit-box {
            width: 450px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            color: #4f46e5;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-update {
            background: #22c55e;
            color: white;
            width: 100%;
        }

        .btn-update:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="edit-box">

    <h2 class="title">✏️ Edit Book</h2>

    <form action="/updateBook" method="post">

        <input type="hidden" name="id" th:value="${book.id}" />

        <label>Title</label>
        <input class="form-control my-2" type="text" name="title" th:value="${book.title}" />

        <label>Author</label>
        <input class="form-control my-2" type="text" name="author" th:value="${book.author}" />

        <label>Category</label>
        <input class="form-control my-2" type="text" name="category" th:value="${book.category}" />

        <button class="btn btn-update mt-3" type="submit">
            Update Book
        </button>

    </form>

</div>

</body>
</html>
