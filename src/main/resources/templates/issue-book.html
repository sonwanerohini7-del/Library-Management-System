<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="card p-4 shadow-lg">

        <h2 class="text-center text-warning">Issue Book</h2>

        <form action="/issueBook" method="post">

            <input type="text" name="studentName" class="form-control mb-3" placeholder="Student Name">

            <input type="text" name="bookName" class="form-control mb-3" placeholder="Book Name">

            <input type="date" name="date" class="form-control mb-3">

            <button type="submit" class="btn btn-warning w-100">Issue Book</button>

        </form>

    </div>

</div>

</body>
</html>
